# dbt Projects on Snowflake: account and user are ignored (the session runs as you).
# One database per environment. Dev follows DBT_DATABASE (env.yml, per-PR CI); prod is fixed.
atlas_finance:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: '_'
      user: '_'
      role: "{{ env_var('DBT_ROLE', 'ATLAS_SNOW_DEV_ROLE') }}"
      warehouse: "{{ env_var('DBT_WAREHOUSE', 'ATLAS_WH') }}"
      database: "{{ env_var('DBT_DATABASE', 'ATLAS_SNOW_DEV') }}"
      schema: dev
      threads: 8
    prod:
      type: snowflake
      account: '_'
      user: '_'
      role: "{{ env_var('DBT_ROLE', 'ATLAS_SNOW_PROD_ROLE') }}"
      warehouse: "{{ env_var('DBT_WAREHOUSE', 'ATLAS_WH') }}"
      database: ATLAS_SNOW_PROD          # fixed: prod never follows DBT_DATABASE
      schema: prod
      threads: 8
