# Environments for dbt Projects on Snowflake (run panel + snow dbt execute --env).
# Nothing here stops a user whose role has prod grants from picking "prod".
env_config:
  default_environment: dev
  environments:
    - name: dev
      env:
        DBT_DATABASE: ATLAS_SNOW_DEV
    - name: staging
      env:
        DBT_DATABASE: ATLAS_SNOW_DEV
    - name: prod
      env:
        DBT_DATABASE: ATLAS_SNOW_PROD
