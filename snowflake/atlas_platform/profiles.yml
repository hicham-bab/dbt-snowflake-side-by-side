# dbt Projects on Snowflake: account and user are ignored (the session runs as you).
# One database per environment; DBT_DATABASE is set per run (see env.yml and CI).
atlas_platform:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: '_'
      user: '_'
      role: "{{ env_var('DBT_ROLE', 'ATLAS_SNOW_DEV_ROLE') }}"
      warehouse: "{{ env_var('DBT_WAREHOUSE', 'ATLAS_WH') }}"
      database: "{{ env_var('DBT_DATABASE', 'ATLAS_SNOW_DEV') }}"
      schema: dev
      threads: 8
    prod:
      type: snowflake
      account: '_'
      user: '_'
      role: "{{ env_var('DBT_ROLE', 'ATLAS_SNOW_PROD_ROLE') }}"
      warehouse: "{{ env_var('DBT_WAREHOUSE', 'ATLAS_WH') }}"
      database: "{{ env_var('DBT_DATABASE', 'ATLAS_SNOW_PROD') }}"
      schema: prod
      threads: 8
