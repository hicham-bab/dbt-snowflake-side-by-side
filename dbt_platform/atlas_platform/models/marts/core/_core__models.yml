version: 2

models:
  - name: dim_customers
    description: >
      Customer dimension, one row per customer, enriched with lifetime order
      statistics, lifecycle stage, and value tier. Rebuilt nightly as a full table.
      Consumed by atlas_finance via dbt Mesh.
    columns:
      - name: customer_id
        description: Unique customer identifier.
        tests:
          - unique
          - not_null
      - name: customer_segment
        tests:
          - accepted_values:
              arguments:
                values: ['VIP', 'Premium', 'Regular', 'Budget']
      - name: customer_lifecycle_stage
        tests:
          - accepted_values:
              arguments:
                values: ['active', 'at_risk', 'churned', 'never_purchased']
      - name: customer_value_tier
        tests:
          - accepted_values:
              arguments:
                values: ['high_value', 'mid_value', 'low_value', 'no_purchases']

  - name: dim_products
    description: Product dimension, 80 active SKUs across 8 categories with cost and margin data.
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: sku
        tests:
          - unique
          - not_null
      - name: category
        tests:
          - not_null

  - name: dim_stores
    description: Store dimension, 19 physical locations + 2 digital channels (online, mobile).
    columns:
      - name: store_id
        tests:
          - unique
          - not_null

  - name: dim_payment_methods
    description: Payment method dimension, accepted payment methods, processors, and fees.
    columns:
      - name: payment_method_id
        tests:
          - unique
          - not_null
      - name: payment_method
        tests:
          - unique
          - not_null
      - name: payment_category
        tests:
          - accepted_values:
              arguments:
                values: ['card', 'digital_wallet', 'bnpl', 'store_credit', 'bank']

  - name: dim_promotions
    description: Promotion dimension, 12 active and historical promo codes covering June 2026 through June 2027.
    columns:
      - name: promotion_id
        tests:
          - unique
          - not_null
      - name: promotion_code
        tests:
          - unique
          - not_null
      - name: discount_type
        tests:
          - accepted_values:
              arguments:
                values: ['percent', 'fixed', 'shipping']

  - name: dim_dates
    description: >
      Date spine 2022-2027 with standard calendar, Atlas fiscal calendar
      (Feb-Jan), US retail holidays, and season flags. Also serves as the
      MetricFlow time spine at daily granularity.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
        tests:
          - unique
          - not_null

  - name: fct_orders
    description: >
      Central order fact table, one row per order. Published to other domains:
      public access, enforced contract, owned by the core_platform group.
      Consumers ref it across projects with dbt Mesh.
    config:
      access: public
      group: core_platform
      contract:
        enforced: true
    latest_version: 1
    versions:
      - v: 1
        defined_in: fct_orders
        deprecation_date: 2027-03-31
        config:
          alias: fct_orders
      - v: 2
        description: Same as v1 with order_level_discount renamed to discount_amount. Prerelease until consumers migrate.
        columns:
          - include: all
            exclude: [order_level_discount]
          - name: discount_amount
            data_type: number(10,2)
            description: Order-level discount amount (was order_level_discount in v1).
    columns:
      - name: order_id
        data_type: number(38,0)
        tests:
          - unique
          - not_null
      - name: order_date
        data_type: date
        tests:
          - not_null
      - name: ordered_at
        data_type: timestamp_ntz
      - name: customer_id
        data_type: number(38,0)
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: store_id
        data_type: number(38,0)
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stores')
                field: store_id
      - name: store_name
        data_type: varchar
      - name: store_type
        data_type: varchar
      - name: store_channel
        data_type: varchar
      - name: store_city
        data_type: varchar
      - name: store_state
        data_type: varchar
      - name: store_region
        data_type: varchar
      - name: order_status
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: ['COMPLETED', 'RETURNED', 'CANCELLED']
      - name: is_completed
        data_type: boolean
      - name: is_returned
        data_type: boolean
      - name: is_cancelled
        data_type: boolean
      - name: payment_method
        data_type: varchar
      - name: campaign_id
        data_type: number(38,0)
      - name: traffic_source
        data_type: varchar
      - name: has_discount
        data_type: boolean
      - name: order_level_discount
        data_type: number(10,2)
        description: Order-level discount amount. Read by atlas_finance (total_discounts).
      - name: item_count
        data_type: number(38,0)
      - name: order_month
        data_type: date
      - name: order_week
        data_type: date
      - name: order_quarter
        data_type: number(38,0)
      - name: order_year
        data_type: number(38,0)
      - name: gross_revenue
        data_type: number(18,2)
        tests:
          - not_null
      - name: net_revenue
        data_type: number(18,2)
        tests:
          - not_null
      - name: total_units
        data_type: number(38,0)
      - name: distinct_products
        data_type: number(38,0)
      - name: estimated_tax
        data_type: number(18,2)
      - name: refund_amount
        data_type: number(10,2)
      - name: return_reason
        data_type: varchar
      - name: return_date
        data_type: date
      - name: has_return
        data_type: boolean
      - name: realized_revenue
        data_type: number(18,2)
        description: Net revenue minus approved refunds.
      - name: _loaded_at
        data_type: timestamp_ltz
      - name: dbt_updated_at
        data_type: timestamp_ltz

  - name: fct_order_items
    description: >
      Order line-item fact, one row per product per order. Incremental (merge),
      clustered by [order_id, category]. Includes unit margin and line margin_pct
      for profitability analysis.
    columns:
      - name: order_item_id
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

  - name: fct_store_performance
    description: >
      Incremental store-day performance fact migrated from SP_STORE_KPI_DAILY.
      One row per active store per reporting date, with order counts, revenue,
      return KPIs, customer reach, performance tier, and top completed-order
      category.
    columns:
      - name: store_id
        description: Store identifier for the daily performance row.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stores')
                field: store_id
      - name: order_date
        description: Calendar date for the store performance metrics.
        tests:
          - not_null
      - name: store_name
        description: Store display name for the daily performance row.
      - name: channel
        description: Sales channel for the store, such as in-store, online, or mobile.
      - name: region
        description: Geographic region for the store.
      - name: total_orders
        description: Count of orders placed for the store on the date.
        tests:
          - not_null
      - name: completed_orders
        description: Count of completed orders for the store on the date.
        tests:
          - not_null
      - name: returned_orders
        description: Count of returned orders for the store on the date.
        tests:
          - not_null
      - name: unique_customers
        description: Count of distinct customers who placed orders at the store on the date.
      - name: gross_revenue
        description: Gross revenue from completed orders for the store on the date.
        tests:
          - not_null
      - name: net_revenue
        description: Net revenue from completed orders for the store on the date.
        tests:
          - not_null
      - name: realized_revenue
        description: Revenue after approved refunds, sourced from fct_orders.
        tests:
          - not_null
      - name: refund_amount
        description: Total refund amount associated with returned orders for the store on the date.
      - name: average_order_value
        description: Gross revenue from completed orders divided by completed order count.
      - name: return_rate_pct
        description: Returned orders as a percentage of total orders.
      - name: performance_tier
        description: Daily revenue tier based on net revenue thresholds.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['A', 'B', 'C', 'D']
      - name: top_category
        description: Highest grossing completed-order product category for the store-date.
      - name: dbt_updated_at
        description: Timestamp when dbt built the row.
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - store_id
              - order_date
