# dbt Projects on Snowflake: drop the PR database when the PR closes.
# Not in the Snowflake tutorial; without it, PR databases pile up.
name: "Snowflake | PR cleanup"
on:
  pull_request:
    types: [closed]
    branches: [main]
    paths: ["snowflake/**"]

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: prod
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
    steps:
      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v2.0.3
        with:
          use-oidc: true
          cli-version: "3.29.0"
      - run: snow sql -x --role ATLAS_SNOW_CI_ROLE -q "DROP DATABASE IF EXISTS ATLAS_SNOW_CI_PR_${{ github.event.number }}"
